{% load i18n %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{% trans "Confirm Email Address" %}</title>
  <style>
    body {
      background-color: #0e1629;
      color: #f1f1f1;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 40px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      background-color: #1e2a3a;
      padding: 40px;
      border-radius: 10px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
      max-width: 500px;
      width: 100%;
      text-align: center;
    }

    h1 {
      color: #ffffff;
      margin-bottom: 20px;
    }

    p {
      color: #cfcfcf;
      margin-bottom: 20px;
    }

    .button {
      display: inline-block;
      padding: 12px 24px;
      background-color: #2e86de;
      color: white;
      text-decoration: none;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .button:hover {
      background-color: #1a5fb4;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>{% trans "Confirm Email Address" %}</h1>
    <p>{% blocktrans with email_address=email_address %}Please confirm that {{ email_address }} is an email address for you. {% endblocktrans %}</p>
    
    <form method="post" action=".">
      {% csrf_token %}
      <button type="submit" class="button">{% trans "Confirm" %}</button>
    </form>
  </div>
</body>
</html>
